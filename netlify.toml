[build]
# version.txt lets CI tell when a deploy preview is serving a given commit.
command = "npm run build && echo $COMMIT_REF > dist/version.txt"
publish = "dist"

[build.environment]
NODE_VERSION = "24"

# Routing rules are generated into dist/_redirects at build time from the route table (src/app/routes.ts):
# every page serves index.html with 200, anything else with 404.

# Vite fingerprints everything in /assets, so it can be cached forever.
[[headers]]
for = "/assets/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"

# The self-hosted fonts aren't fingerprinted, so a changed font must get a new file name.
[[headers]]
for = "/fonts/*"
[headers.values]
Cache-Control = "public, max-age=31536000, immutable"
